name: Run V2Ray
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'deploy or stop'
        required: true
        default: 'deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event.inputs.command == 'deploy'
    steps:
      - name: Install Xray
        run: |
          bash <(curl -sL https://raw.githubusercontent.com/XTLS/Xray-install/main/install-release.sh) install
      
      - name: Create config
        run: |
          cat > config.json << EOF
          {
            "inbounds": [{
              "port": 8080,
              "protocol": "vmess",
              "settings": {
                "clients": [{"id": "12345678-1234-1234-1234-123456789012"}]
              },
              "streamSettings": {
                "network": "ws"
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF
      
      - name: Get server info
        run: |
          echo "=================================="
          echo "Server IP:"
          curl -s ifconfig.me
          echo ""
          echo "Port: 8080"
          echo "Protocol: vmess+ws"
          echo "UUID: 12345678-1234-1234-1234-123456789012"
          echo "=================================="
      
      - name: Run Xray
        run: |
          xray run -c config.json &
          echo "Xray is running. Waiting 6 hours..."
          sleep 6h

  stop:
    runs-on: ubuntu-latest
    if: github.event.inputs.command == 'stop'
    steps:
      - name: Stop
        run: echo "Workflow stopped - no action needed"
